name: CI Backend - TrackBot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Automate Deploy (AWS)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          # Substitua "/caminho/no/servidor" pelo diretório real onde o projeto backend foi clonado na sua AWS
          script: |
            cd /caminho/no/servidor/trackbot-backend
            git pull origin main
            # 1. Faz o build forçando a recriação para garantir que o código novo seja injetado
            docker-compose up -d --build --force-recreate
            # 2. Reinicia o serviço especificamente (opcional, mas garante restart limpo da aplicação)
            docker-compose restart api
            # 3. Limpeza profunda: remove imagens antigas, networks sem uso e containers parados para não lotar a AWS
            docker system prune -af

